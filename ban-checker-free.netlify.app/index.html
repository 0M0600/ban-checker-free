<html lang="fr">
<head>
  <meta charset="UTF-8">

     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAJI D JAP - BAN CHECKER</title>
  <style>
    /* --- Couleurs et Reset --- */
    :root {
      --bg-color: #050505; /* Noir très profond */
      --card-bg: rgba(10, 12, 20, 0.9); /* Légère transparence pour voir le fond */
      --text-main: #ffffff;
      --text-muted: #b0b0b0;
      --primary: #00ff41; /* Vert Matrix/Virus vif */
      --primary-hover: #00cc33;
      --accent: #ff0033; /* Rouge néon agressif */
      --virus-green: rgba(0, 255, 65, 0.15); /* Vert virus subtil */
      --shadow: 0 0 40px rgba(255, 0, 51, 0.6); /* Ombre rouge */
      --glow-green: 0 0 10px rgba(0, 255, 65, 0.7);
      --glow-red: 0 0 15px rgba(255, 0, 51, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; font-weight: 900 !important; } /* Courier New pour look hacker + Gras max */

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      
      /* --- ARRIÈRE-PLAN INTÉGRÉ --- */
      /* Remplacez 'URL_DE_VOTRE_IMAGE' par l'endroit où vous hébergez l'image, ou utilisez le chemin local. */
      /* J'ai ajouté un dégradé radial pour assombrir les bords et focaliser sur le centre. */
      background-image: 
        radial-gradient(circle, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.9) 80%),
        url('https://ban-checker-free.netlify.app/image_0.png'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed; /* L'image ne défile pas */
      background-repeat: no-repeat;
    }

    /* --- Animations Clés --- */
    @keyframes glitch {
      0% { text-shadow: 3px 0 var(--accent), -3px 0 #00e5ff; }
      20% { text-shadow: -3px 0 var(--accent), 3px 0 #00e5ff; }
      40% { text-shadow: 3px 0 var(--accent), -3px 0 #00e5ff; }
      60% { text-shadow: -3px 0 var(--accent), 3px 0 #00e5ff; }
      80% { text-shadow: 3px 0 var(--accent), -3px 0 #00e5ff; }
      100% { text-shadow: -3px 0 var(--accent), 3px 0 #00e5ff; }
    }

    @keyframes pulse-border-red {
      0% { box-shadow: 0 0 0 0 rgba(255, 0, 51, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(255, 0, 51, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 0, 51, 0); }
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    @keyframes characterMove {
      0%, 100% { transform: translateY(0) translateX(-50%) scale(1); }
      50% { transform: translateY(-15px) translateX(-49%) scale(1.02); }
    }
    
    /* Animation Matrix Virus */
    @keyframes matrixBg {
      0% { background-position: 0% 0%; }
      100% { background-position: 0% 100%; }
    }

    /* --- Conteneur Principal (Card) --- */
    .card {
      background: var(--card-bg);
      padding: 50px 35px;
      border-radius: 10px; /* Bords plus nets */
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 480px;
      text-align: center;
      border: 3px solid var(--accent); /* Bordure rouge épaisse */
      position: relative;
      overflow: hidden;
      animation: fadeIn 1s ease-out;
      backdrop-filter: blur(5px); /* Flou derrière pour la lisibilité */
    }
    
    /* Overlay Effet Virus/Matrix dans la carte */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 200%;
      background: linear-gradient(180deg, rgba(0,255,65,0) 0%, var(--virus-green) 50%, rgba(0,255,65,0) 100%);
      background-size: 100% 20px;
      animation: matrixBg 10s linear infinite;
      z-index: -1;
      opacity: 0.5;
    }

    /* --- Menu Trois Points --- */
    .menu-container { position: absolute; top: 15px; right: 15px; z-index: 10; }
    .menu-dots { font-size: 2rem; color: var(--accent); cursor: pointer; transition: 0.3s; user-select: none; text-shadow: var(--glow-red); }
    .menu-dots:hover { color: var(--text-main); text-shadow: 0 0 10px #fff; }

    .menu-dropdown {
      position: absolute; top: 35px; right: 0; background: #000; border: 2px solid var(--primary); border-radius: 5px;
      width: 200px; box-shadow: 0 0 20px rgba(0,255,65,0.5); display: none; overflow: hidden; z-index: 11;
    }
    .menu-dropdown.show { display: block; animation: fadeIn 0.3s ease; }
    .menu-item { padding: 15px; color: var(--primary); cursor: pointer; text-align: left; font-size: 1rem; text-transform: uppercase; border-bottom: 1px solid rgba(0,255,65,0.3); transition: 0.3s; }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: rgba(0,255,65,0.2); color: #fff; text-shadow: var(--glow-green); }
    .menu-item.active { background: rgba(0,255,65,0.3); color: #fff; font-weight: 900; text-shadow: var(--glow-green); border-left: 4px solid var(--primary); }

    /* --- Zone Personnage (Désactivée car fond global utilisé) --- */
    /*
    .character-bg {
      position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
      width: 100%; height: auto; max-height: 80%; object-fit: contain; opacity: 0.15; z-index: 0; pointer-events: none;
      animation: characterMove 6s infinite ease-in-out; display: none;
    }
    .character-bg.active { display: block; }
    */

    /* --- Titres Stylés, Gras et Animés --- */
    .main-title {
      font-size: 1.8rem; font-weight: 900; color: #fff; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 10px; position: relative; z-index: 1;
      text-shadow: var(--glow-red), 0 0 5px #000;
      animation: glitch 2s infinite;
    }
    
    /* Décorations Sataniques autour du titre */
    .title-wrap::before, .title-wrap::after {
      content: " ⛧ ";
      color: var(--accent);
      font-size: 1.5rem;
      text-shadow: var(--glow-red);
    }

    .sub-title {
      font-size: 1.2rem; color: var(--primary); font-weight: 900; text-transform: uppercase;
      letter-spacing: 2px; margin-bottom: 30px; position: relative; z-index: 1;
      display: none; text-shadow: var(--glow-green);
    }
    .sub-title.active { display: block; animation: fadeIn 0.5s ease; }

    /* --- Input Group --- */
    .input-group { margin-bottom: 25px; text-align: left; position: relative; z-index: 1; }
    label { display: block; font-size: 0.9rem; margin-bottom: 10px; color: #fff; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 5px #000;}
    input {
      width: 100%; padding: 16px 20px; border-radius: 5px; border: 2px solid var(--primary);
      background: rgba(0, 0, 0, 0.8); color: var(--primary); font-size: 1.1rem; outline: none;
      transition: all 0.3s; font-weight: 900; box-shadow: inset 0 0 10px rgba(0,255,65,0.2);
    }
    input:focus { border-color: #fff; box-shadow: var(--glow-green); color: #fff; }
    input::placeholder { color: rgba(0,255,65,0.5); font-weight: 900; }

    /* --- Bouton Animé, Gras et Cool --- */
    .check-btn {
      width: 100%; padding: 16px; background: none; color: var(--accent);
      font-weight: 900; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px;
      border: 3px solid var(--accent); border-radius: 5px; cursor: pointer; position: relative; z-index: 1;
      transition: all 0.3s; overflow: hidden;
      animation: pulse-border-red 2s infinite;
      text-shadow: var(--glow-red);
    }
    .check-btn:hover { background: var(--accent); color: #000; text-shadow: none; box-shadow: 0 0 30px var(--accent); transform: scale(1.03); }
    .check-btn:active { transform: translateY(2px) scale(1); }

    /* --- Zone de Statut (Résultat) --- */
    .status { margin-top: 30px; padding: 20px; border-radius: 5px; font-weight: 900; font-size: 1rem; display: none; position: relative; z-index: 1; animation: fadeIn 0.4s ease; text-transform: uppercase; border-width: 2px; border-style: solid;}
    
    .active { background: rgba(0, 50, 20, 0.9); color: var(--primary); border-color: var(--primary); box-shadow: var(--glow-green); text-shadow: var(--glow-green); }
    
    .banned { background: rgba(60, 0, 0, 0.9); color: #fff; border-color: var(--accent); box-shadow: var(--glow-red); text-shadow: var(--glow-red); animation: glitch 0.3s infinite; }
    
    .loading { background: rgba(0, 0, 50, 0.9); color: #fff; border-color: #00e5ff; box-shadow: 0 0 15px #00e5ff; text-shadow: 0 0 10px #00e5ff;}

    /* --- Footer --- */
    .footer { 
      margin-top: 40px; font-size: 0.8rem; color: var(--accent); 
      text-transform: uppercase; letter-spacing: 1px; 
      position: relative; z-index: 1; font-weight: 900;
      text-shadow: 0 0 5px #000;
    }
    .footer::before, .footer::after { content: " ⛧ "; }

  </style>
</head>
<body>

  <div class="card">
    <!-- Menu caché -->
    <div class="menu-container">
      <div class="menu-dots" onclick="toggleMenu()">&#8942;</div>
      <div id="menuDropdown" class="menu-dropdown">
        <div class="menu-item active" onclick="selectPlace('hajun')">BAJI D JAP</div>
        <div class="menu-item" onclick="selectPlace('empereur')">BAJI D JAP</div>
        <div class="menu-item" onclick="selectPlace('baron')">L'ANGE SANS TETE</div>
        <div class="menu-item" onclick="selectPlace('esdeath')">L'AVARICE</div>
      </div>
    </div>

    <!-- Titres avec décorations occultes -->
    <div class="title-wrap">
      <h1 class="main-title">BAN CHECK FREE BY BAJI D JAP</h1>
    </div>
    
    <!-- Sous-titres dynamiques -->
    <div id="title-hajun" class="sub-title active">BAJI D JAP</div>
    <div id="title-empereur" class="sub-title">BAJI D JAP<br> <span style="font-size:0.9rem; color:#fff; font-weight:900;">[L'ANGE SANS TETE]</span></div>
    <div id="title-baron" class="sub-title">L'ANGE SANS TETE<br> <span style="font-size:0.9rem; color:#fff; font-weight:900;">[L'ANGE SANS TETE]</span></div>
    <div id="title-esdeath" class="sub-title">LE PECHER DE L'AVARICE</div>

    <!-- Formulaire -->
    <div class="input-group">
      <label for="phone">NUMÉRO WHATSAPP DE LQ CIBLE</label>
      <input type="tel" id="phone" placeholder="Ex: 243861234567...">
    </div>

    <button class="check-btn" onclick="checkStatus()">[ EXÉCUTER VÉRIFICATION ]</button>

    <!-- Zone de résultat -->
    <div id="statusBox" class="status"></div>

    <!-- Footer -->
    <div class="footer">ʙᴀᴊɪ•ᴅ•ᴊᴀᴘ ⚖️…ʟ’ᴀɴɢᴇ ᴤᴀɴᴤ ᴛÊᴛᴇ…</div>
  </div>

  <script>
    // Configuration des textes de bannissement par place (Gras conservé par le CSS global)
    const banMessages = {
      hajun: " ᴛ’ᴀᴜʀᴀɪᴤ ᴊᴀᴍᴀɪᴤ ᴅÛ ᴄʀᴏɪᴤᴇʀ ᴍᴀ ʀᴏᴜᴛᴇ…ᴍᴀɪɴᴛᴇɴᴀɴᴛ ᴅᴏʀᴤ ᴘᴏᴜʀ ᴛᴏᴜᴊᴏᴜʀᴤ…👣ʙᴀᴊɪ•ᴅ•ᴊᴀᴘ ⚖️…ʟ’ᴀɴɢᴇ ᴤᴀɴᴤ ᴛÊᴛᴇ"
     empereur: " 𝑷𝑨𝑹 𝑴𝑶𝑵 𝑵𝑶𝑴 : 𝑩𝑨𝑱𝑰•𝑫•𝑱𝑨𝑷 ⚖️…𝑳’𝑨𝑵𝑮𝑬 𝑺𝑨𝑵𝑺 𝑻Ê𝑻𝑬… 𝑻𝑼 𝑬𝑺 𝑴𝑰𝑺𝑬 À ",
      esdeath: "𝑪𝒐𝒏𝒕𝒊𝒏𝒖𝒆𝒛 𝒅𝒆 𝒓𝒂𝒎𝒑𝒆𝒓, 𝒍𝒂 𝒗𝒖𝒆 𝒆𝒔𝒕 𝒃𝒆𝒍𝒍𝒆 𝒒𝒖𝒂𝒏𝒅 𝒋𝒆 𝒗𝒐𝒖𝒔 𝒓𝒆𝒗𝒂𝒓𝒊𝒄𝒆… 𝒂𝒍𝒊𝒂𝒔 𝒍’𝒂𝒏𝒈𝒆 𝒔𝒂𝒏𝒔 𝒕ê𝒕𝒆…"
    
};

    let currentPlace = 'hajun'; // Place par défaut

    // Gestion du menu
    function toggleMenu() {
      document.getElementById('menuDropdown').classList.toggle('show');
    }

    // Fermer le menu si on clique ailleurs
    window.onclick = function(event) {
      if (!event.target.matches('.menu-dots')) {
        var dropdowns = document.getElementsByClassName("menu-dropdown");
        for (var i = 0; i < dropdowns.length; i++) {
          var openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }

    // Changement de place/personnage
    function selectPlace(placeId) {
      currentPlace = placeId;
      toggleMenu();

      // Mettre à jour l'item actif dans le menu
      const items = document.querySelectorAll('.menu-item');
      items.forEach(item => item.classList.remove('active'));
      event.target.classList.add('active');

      // Masquer tous les sous-titres
      const titles = document.querySelectorAll('.sub-title');
      titles.forEach(title => title.classList.remove('active'));
      
      // Afficher le sous-titre correspondant
      document.getElementById('title-' + placeId).classList.add('active');

      // Réinitialiser la zone de statut
      const box = document.getElementById('statusBox');
      box.style.display = "none";
      box.innerHTML = "";
    }

    // Logique de vérification simulée
    async function checkStatus() {
      const phoneInput = document.getElementById('phone').value.replace(/[^0-9]/g, '');
      const box = document.getElementById('statusBox');

      if (!phoneInput || phoneInput.length < 8) {
        box.className = "status banned";
        box.innerText = "❌ ERREUR SYSTÈME : NUMÉRO INVALIDE. INDICATIF OBLIGATOIRE (EX: 243...).";
        box.style.display = "block";
        return;
      }

      box.className = "status loading";
      box.innerText = "⏳ INJECTION DES PROTOCOLES... ANALYSE PAR BAJI D JAP L'ANGE SANS TETE...";
      box.style.display = "block";

      // Simulation du délai de vérification (2 secondes)
      await new Promise(resolve => setTimeout(resolve, 2000));

      // Logique factice : Banni si le dernier chiffre est impair
      const isBanned = parseInt(phoneInput.slice(-1)) % 2 !== 0;

      if (!isBanned) {
        box.className = "status active";
        box.innerText = "✅ STATUT : CONTINNUE DE FUIR ET MANGE DU POULET";
      } else {
        box.className = "status banned";
        box.innerText = banMessages[currentPlace];
      }
    }
  </script>

</body>
</html>
